# Runs the real application (no fakes) on http://localhost:8080 (P1-X2).
# The API key comes from a local .env file (never committed): copy .env.example to .env and fill it in.
# Without a key the application still works on the seed files (AAPL, MSFT, SPY, JPM).
services:
  web:
    build: .
    image: quantbacktest
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      QuantBacktest__DatabasePath: /data/quantbacktest.db
      QuantBacktest__SeedDirectory: /app/seed
      AlphaVantage__ApiKey: ${ALPHAVANTAGE_API_KEY}
    volumes:
      - quantbacktest-data:/data
    restart: unless-stopped

volumes:
  quantbacktest-data:
